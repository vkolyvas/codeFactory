  <rect x="154" y="64" width="6" height="12" rx="2" fill="#0a0a0f"/>

  <!-- Writer (indigo) -->
  <rect x="172" y="52" width="36" height="36" rx="8" fill="#818cf8" opacity="0.9"/>

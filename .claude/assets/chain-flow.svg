<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" fill="none" xmlns:xlink="http://www.w3.org/1999/xlink">
  <rect width="900" height="280" rx="16" fill="#0a0a0f"/>

  <!-- Title -->
  <text x="450" y="28" font-family="monospace" font-size="14" fill="#8888aa" text-anchor="middle" letter-spacing="3">CHAIN FLOW</text>

  <!-- Phase boxes -->
  <!-- Researcher -->

  <text x="300" y="190" font-family="monospace" font-size="9" fill="#4ade80">frontend-summary.md</text>
  <text x="300" y="206" font-family="monospace" font-size="9" fill="#4ade80">observed-dependencies.json</text>
  <text x="300" y="222" font-family="monospace" font-size="9" fill="#4ade80">security-findings.md</text>
  <text x="300" y="238" font-family="monospace" font-size="9" fill="#4ade80">architecture-findings.md</text>

  <text x="580" y="174" font-family="monospace" font-size="9" fill="#4ade80">migration-findings.md</text>

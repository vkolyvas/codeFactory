<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" fill="none" xmlns:xlink="http://www.w3.org/1999/xlink">
  <rect width="900" height="260" rx="16" fill="#0a0a0f"/>

  <!-- Title -->
  <text x="450" y="28" font-family="monospace" font-size="14" fill="#8888aa" text-anchor="middle" letter-spacing="3">ARCHITECTURE ENFORCEMENT</text>

  <!-- DECLARED column -->
  <rect x="30" y="46" width="360" height="130" rx="12" fill="#7c6fcd" opacity="0.07" stroke="#7c6fcd" stroke-width="2"/>
  <text x="210" y="66" font-family="monospace" font-size="13" fill="#7c6fcd" text-anchor="middle" letter-spacing="2">DECLARED</text>
  <text x="210" y="82" font-family="monospace" font-size="9" fill="#7c6fcd60" text-anchor="middle">what SHOULD exist — authored once at chain start</text>
  <line x1="50" y1="92" x2="370" y2="92" stroke="#7c6fcd40" stroke-width="1"/>

  <text x="50" y="112" font-family="monospace" font-size="10" fill="#4ade80">kind: declared</text>
  <text x="50" y="128" font-family="monospace" font-size="10" fill="#4ade80">declared_at: ISO8601</text>
  <text x="50" y="144" font-family="monospace" font-size="10" fill="#4ade80">layers: api / services / repositories</text>
  <text x="50" y="160" font-family="monospace" font-size="10" fill="#4ade80">forbidden: [api→db, components→prisma]</text>
  <text x="50" y="176" font-family="monospace" font-size="10" fill="#4ade80">ownership: {backend/frontend lane assignments}</text>
  <text x="50" y="192" font-family="monospace" font-size="10" fill="#fbbf24">escape_hatches: [shared/** → cross_domain]</text>
  <text x="50" y="208" font-family="monospace" font-size="9" fill="#7c6fcd80">written by: orchestrator (spec-writer owns)</text>

  <!-- ORCHESTRATOR annotation -->
  <rect x="30" y="184" width="160" height="22" rx="4" fill="#7c6fcd20" stroke="#7c6fcd60" stroke-width="1"/>
  <text x="110" y="199" font-family="monospace" font-size="8" fill="#7c6fcd" text-anchor="middle">spec-writer reviews</text>

  <!-- Center cross / diff -->
  <circle cx="450" cy="111" r="26" fill="#0a0a0f" stroke="#f472b6" stroke-width="2"/>
  <text x="450" y="106" font-family="monospace" font-size="9" fill="#f472b6" text-anchor="middle">DECLARED</text>
  <text x="450" y="118" font-family="monospace" font-size="9" fill="#f472b6" text-anchor="middle">vs</text>
  <text x="450" y="130" font-family="monospace" font-size="9" fill="#f472b6" text-anchor="middle">OBSERVED</text>

  <!-- Arrow declared → diff -->
  <line x1="392" y1="111" x2="424" y2="111" stroke="#7c6fcd" stroke-width="2"/>
  <polygon points="424,111 418,107 418,115" fill="#7c6fcd"/>

  <!-- Arrow diff → observed -->
  <line x1="476" y1="111" x2="508" y2="111" stroke="#4ade80" stroke-width="2"/>
  <polygon points="508,111 502,107 502,115" fill="#4ade80"/>

  <!-- OBSERVED column -->
  <rect x="510" y="46" width="360" height="130" rx="12" fill="#4ade80" opacity="0.07" stroke="#4ade80" stroke-width="2"/>
  <text x="690" y="66" font-family="monospace" font-size="13" fill="#4ade80" text-anchor="middle" letter-spacing="2">OBSERVED</text>
  <text x="690" y="82" font-family="monospace" font-size="9" fill="#4ade8060" text-anchor="middle">what DOES exist — generated by architecture-reviewer</text>
  <line x1="530" y1="92" x2="850" y2="92" stroke="#4ade8040" stroke-width="1"/>

  <text x="530" y="112" font-family="monospace" font-size="10" fill="#4ade80">generated by: architecture-reviewer</text>
  <text x="530" y="128" font-family="monospace" font-size="10" fill="#4ade80">tool: npx depcruise --output-type json</text>
  <text x="530" y="144" font-family="monospace" font-size="10" fill="#4ade80">output: observed-dependencies.json</text>
  <text x="530" y="160" font-family="monospace" font-size="10" fill="#4ade80">written to: {artifact_root}/</text>
  <text x="530" y="176" font-family="monospace" font-size="10" fill="#4ade80">NOT written to arch-contract.yaml</text>
  <text x="530" y="192" font-family="monospace" font-size="9" fill="#4ade8080">separate artifact, compared not merged</text>

  <!-- Violation / pass outputs below -->
  <rect x="30" y="184" width="840" height="62" rx="10" fill="#1e1c2e" opacity="0.5" stroke="#3d3a5c" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- Violation case -->
  <rect x="50" y="198" width="160" height="32" rx="6" fill="#f87171" opacity="0.2" stroke="#f87171" stroke-width="1.5"/>
  <text x="130" y="212" font-family="monospace" font-size="10" fill="#f87171" text-anchor="middle">violation found</text>
  <text x="130" y="225" font-family="monospace" font-size="9" fill="#f8717180" text-anchor="middle">→ Critical in findings</text>

  <!-- No violation case -->
  <rect x="230" y="198" width="160" height="32" rx="6" fill="#4ade80" opacity="0.2" stroke="#4ade80" stroke-width="1.5"/>
  <text x="310" y="212" font-family="monospace" font-size="10" fill="#4ade80" text-anchor="middle">all clear</text>
  <text x="310" y="225" font-family="monospace" font-size="9" fill="#4ade8080" text-anchor="middle">→ pass cleanly</text>

  <!-- Escape hatch case -->
  <rect x="410" y="198" width="240" height="32" rx="6" fill="#fbbf24" opacity="0.2" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="530" y="212" font-family="monospace" font-size="10" fill="#fbbf24" text-anchor="middle">escape_hatch invoked</text>
  <text x="530" y="225" font-family="monospace" font-size="9" fill="#fbbf2480" text-anchor="middle">// override: documented_reason + annotation present → allowed</text>

  <!-- Escape hatch violation case -->
  <rect x="670" y="198" width="190" height="32" rx="6" fill="#f87171" opacity="0.2" stroke="#f87171" stroke-width="1.5"/>
  <text x="765" y="212" font-family="monospace" font-size="10" fill="#f87171" text-anchor="middle">escape_hatch abuse</text>
  <text x="765" y="225" font-family="monospace" font-size="9" fill="#f8717180" text-anchor="middle">no annotation → Critical</text>
</svg>
